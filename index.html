<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="REVT 검사">
<meta name="theme-color" content="#c2185b">
<title>REVT 수용·표현 어휘력 검사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ── 기본 리셋 & 변수 ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --pink:       #c2185b;
  --pink-mid:   #e91e8c;
  --pink-light: #fce4f3;
  --pink-pale:  #fdf0f8;
  --blue:       #1565c0;
  --blue-light: #e3f2fd;
  --green:      #2e7d32;
  --green-light:#e8f5e9;
  --amber:      #e65100;
  --amber-light:#fff3e0;
  --red:        #b71c1c;
  --red-light:  #ffebee;
  --gray:       #546e7a;
  --gray-light: #f5f7f8;
  --border:     #e0e0e0;
  --text:       #1a1a2e;
  --text-sub:   #546e7a;
  --radius:     10px;
  --radius-lg:  16px;
  --shadow:     0 2px 12px rgba(194,24,91,.08);
  --shadow-lg:  0 6px 28px rgba(194,24,91,.14);
}
html { font-size: 15px; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: #fafafa;
  color: var(--text);
  min-height: 100vh;
  -webkit-tap-highlight-color: transparent;
}

/* ── 레이아웃 ── */
.app { max-width: 500px; margin: 0 auto; padding: 0 0 100px; }

/* ── 헤더 ── */
.header {
  background: linear-gradient(135deg, #c2185b 0%, #e91e8c 60%, #f06292 100%);
  color: white;
  padding: 22px 20px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 3px 16px rgba(194,24,91,.30);
}
.header-inner { display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
.header p  { font-size: 11px; opacity: .8; margin-top: 2px; }
.header-badge {
  background: rgba(255,255,255,.2);
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 20px;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}

/* ── 스텝 바 ── */
.step-wrap { padding: 14px 20px 0; }
.step-bar { display: flex; gap: 5px; margin-bottom: 6px; }
.step-seg {
  flex: 1; height: 5px; border-radius: 3px;
  background: var(--border); transition: background .35s;
}
.step-seg.done   { background: var(--pink-mid); }
.step-seg.active { background: var(--pink); }
.step-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-sub); padding: 0 1px; }
.step-labels span.cur { color: var(--pink); font-weight: 600; }

/* ── 콘텐츠 ── */
.content { padding: 14px 16px 0; }

/* ── 카드 ── */
.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.card-title {
  font-size: 13px; font-weight: 600; color: var(--text-sub);
  margin-bottom: 14px; display: flex; align-items: center; gap: 7px;
  text-transform: uppercase; letter-spacing: .5px;
}
.card-title svg { flex-shrink: 0; }

/* ── 폼 ── */
.form-group { margin-bottom: 14px; }
.form-group:last-child { margin-bottom: 0; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 5px; }
input[type=text], input[type=date] {
  width: 100%; padding: 10px 13px;
  border: 1.5px solid var(--border); border-radius: var(--radius);
  font-size: 15px; font-family: inherit;
  background: white; color: var(--text);
  transition: border-color .2s, box-shadow .2s;
  -webkit-appearance: none;
}
input:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 3px rgba(194,24,91,.1); }

/* ── 나이 배지 ── */
.age-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--pink-light); color: var(--pink);
  border-radius: var(--radius); padding: 8px 13px;
  font-size: 13px; font-weight: 600; margin-top: 10px;
  border: 1px solid rgba(194,24,91,.2);
  animation: fadeIn .3s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }

/* ── 상태 박스 ── */
.status-box {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; border-radius: var(--radius);
  font-size: 12px; font-weight: 500; margin-bottom: 8px;
}
.status-success { background: var(--green-light); color: var(--green); border: 1px solid #a5d6a7; }
.status-warn    { background: var(--amber-light);  color: var(--amber);  border: 1px solid #ffcc80; }
.status-error   { background: var(--red-light);    color: var(--red);    border: 1px solid #ef9a9a; }
.status-info    { background: var(--blue-light);   color: var(--blue);   border: 1px solid #90caf9; }

/* ── 점수 그리드 ── */
.score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.score-card {
  background: var(--gray-light); border-radius: var(--radius);
  padding: 11px 10px; text-align: center; border: 1px solid var(--border);
}
.score-label { font-size: 10px; color: var(--text-sub); margin-bottom: 3px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
.score-val   { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1; }
.score-val small { font-size: 13px; font-weight: 500; }

/* ── 섹션 구분선 ── */
.divider {
  display: flex; align-items: center; gap: 8px;
  margin: 14px 0 10px; font-size: 11px; font-weight: 600;
  color: var(--text-sub); text-transform: uppercase; letter-spacing: .5px;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

/* ── 연습문항 행 ── */
.practice-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px;
}
.practice-row:last-child { border-bottom: none; }

/* ── 문항 행 ── */
.item-row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 0; border-bottom: 1px solid #f5f5f5;
}
.item-row:last-child { border-bottom: none; }
.item-num  { font-size: 11px; color: #aaa; min-width: 24px; text-align: right; }
.item-word { flex: 1; font-size: 14px; line-height: 1.3; }
.item-word.bl { font-weight: 700; color: var(--pink); }
.item-word.cl { font-weight: 700; color: var(--red); }

/* ── O/X 버튼 ── */
.btn-o, .btn-x {
  min-width: 42px; height: 36px; padding: 0 10px;
  border-radius: 8px; border: 1.5px solid transparent;
  cursor: pointer; font-size: 14px; font-weight: 700;
  transition: all .15s; font-family: inherit;
}
.btn-o { background: var(--green-light); color: var(--green); border-color: #a5d6a7; }
.btn-x { background: var(--red-light);   color: var(--red);   border-color: #ef9a9a; }
.btn-o.sel { background: var(--green); color: white; border-color: var(--green); }
.btn-x.sel { background: var(--red);   color: white; border-color: var(--red); }
.btn-o:active { transform: scale(.93); }
.btn-x:active { transform: scale(.93); }

/* ── 통과/실패 버튼 ── */
.btn-pass, .btn-fail {
  padding: 7px 14px; border-radius: 8px; border: 1.5px solid transparent;
  cursor: pointer; font-size: 13px; font-weight: 600;
  transition: all .15s; font-family: inherit;
}
.btn-pass { background: var(--green-light); color: var(--green); border-color: #a5d6a7; }
.btn-fail { background: var(--red-light);   color: var(--red);   border-color: #ef9a9a; }
.btn-pass.sel { background: var(--green); color: white; }
.btn-fail.sel { background: var(--red);   color: white; }

/* ── 기본 버튼 ── */
.btn-primary {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, var(--pink) 0%, var(--pink-mid) 100%);
  color: white; border: none; border-radius: var(--radius-lg);
  font-size: 15px; font-weight: 700; cursor: pointer;
  font-family: inherit; letter-spacing: -.2px;
  box-shadow: 0 4px 14px rgba(194,24,91,.35);
  transition: opacity .2s, transform .15s;
  margin-top: 10px;
}
.btn-primary:active { transform: scale(.97); }
.btn-primary:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
.btn-secondary {
  width: 100%; padding: 11px;
  background: white; color: var(--text-sub);
  border: 1.5px solid var(--border); border-radius: var(--radius-lg);
  font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;
  transition: background .15s; margin-top: 8px;
}
.btn-secondary:active { background: #f5f5f5; }

/* ── 네비 버튼 묶음 ── */
.nav-btns { display: flex; gap: 8px; margin-top: 12px; }
.nav-btns .btn-primary  { flex: 1; margin-top: 0; }
.nav-btns .btn-secondary{ flex: 0 0 80px; margin-top: 0; }

/* ── 탭 ── */
.tabs {
  display: flex; border: 1.5px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 14px;
}
.tab {
  flex: 1; padding: 9px 4px; font-size: 13px; font-weight: 600;
  text-align: center; cursor: pointer; border: none;
  background: white; color: var(--text-sub);
  border-right: 1px solid var(--border); transition: all .2s;
  font-family: inherit;
}
.tab:last-child { border-right: none; }
.tab.active { background: var(--pink); color: white; }

/* ── 결과 행 ── */
.result-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid #f5f5f5; font-size: 13px;
}
.result-row:last-child { border-bottom: none; }
.rk { color: var(--text-sub); }
.rv { font-weight: 700; }
.rv.good { color: var(--green); }
.rv.warn { color: var(--amber); }
.rv.bad  { color: var(--red); }

/* ── 바 차트 ── */
.bar-wrap { margin: 8px 0; }
.bar-label-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }
.bar-track {
  height: 20px; background: #f0f0f0; border-radius: 10px;
  overflow: hidden; border: 1px solid #e0e0e0;
}
.bar-fill {
  height: 100%; border-radius: 10px; min-width: 36px;
  display: flex; align-items: center; justify-content: flex-end;
  padding-right: 8px; transition: width .7s cubic-bezier(.4,0,.2,1);
}
.bar-fill span { font-size: 10px; color: white; font-weight: 700; }

/* ── 노트 박스 ── */
.note {
  font-size: 11px; line-height: 1.7; color: var(--text-sub);
  background: var(--gray-light); border-radius: var(--radius);
  padding: 9px 11px; margin-top: 8px; border: 1px solid var(--border);
}

/* ── 인쇄 버튼 영역 ── */
.print-area {
  background: white; border: 1.5px solid var(--border);
  border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.print-area-title {
  font-size: 12px; font-weight: 700; color: var(--text-sub);
  text-transform: uppercase; letter-spacing: .5px;
  margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
}
.print-guide {
  font-size: 11px; line-height: 1.8; color: var(--text-sub);
  background: var(--pink-pale); border: 1px solid rgba(194,24,91,.15);
  border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px;
}
.print-guide b { color: var(--pink); }
.btn-print {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, #c2185b 0%, #e91e8c 100%);
  color: white; border: none; border-radius: var(--radius-lg);
  font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 4px 16px rgba(194,24,91,.35); transition: opacity .2s, transform .15s;
}
.btn-print:active { transform: scale(.97); opacity: .9; }
.btn-reset {
  width: 100%; padding: 11px; margin-top: 8px;
  background: white; color: var(--text-sub);
  border: 1.5px solid var(--border); border-radius: var(--radius-lg);
  font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background .15s;
}
.btn-reset:active { background: #f5f5f5; }

/* ── 유틸 ── */
.hidden { display: none !important; }
.mt8    { margin-top: 8px; }
.mt12   { margin-top: 12px; }


/* ── 인쇄 전용 ── */
#printFrame { display: none; }

@media print {
  body > .app,
  body > *:not(#printFrame) { display: none !important; }
  #printFrame {
    display: block !important;
    font-family: 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    font-size: 13px; color: #1a1a1a;
    padding: 0; margin: 0;
  }
  @page { size: A4; margin: 14mm 14mm 18mm; }
  /* 결과지 내부 스타일 */
  #printFrame .rh { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:3px solid #c2185b; padding-bottom:14px; margin-bottom:20px; }
  #printFrame .rh-left h1 { font-size:18px; font-weight:800; color:#c2185b; letter-spacing:-.5px; }
  #printFrame .rh-left p  { font-size:11px; color:#999; margin-top:3px; }
  #printFrame .rh-right   { font-size:11px; color:#999; text-align:right; line-height:1.7; }
  #printFrame .info-row   { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
  #printFrame .info-box   { background:#fdf0f8; border-radius:8px; padding:10px 13px; border:1px solid #f5c6e0; }
  #printFrame .info-box .lbl { font-size:10px; color:#c2185b; font-weight:700; letter-spacing:.5px; text-transform:uppercase; margin-bottom:3px; }
  #printFrame .info-box .val { font-size:14px; font-weight:700; }
  #printFrame .info-box .sub { font-size:10px; color:#666; margin-top:1px; }
  #printFrame .sec        { margin-bottom:18px; }
  #printFrame .sec-title  { font-size:13px; font-weight:800; border-left:4px solid #c2185b; padding-left:10px; margin-bottom:12px; }
  #printFrame .sum-row    { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
  #printFrame .sum-box    { border-radius:10px; padding:12px 14px; border:1px solid #e0e0e0; }
  #printFrame .sum-box.exp{ background:#fdf0f8 !important; border-color:#f5c6e0 !important; }
  #printFrame .sum-box.rec{ background:#e3f2fd !important; border-color:#90caf9 !important; }
  #printFrame .sum-box h3 { font-size:13px; font-weight:800; margin-bottom:9px; }
  #printFrame .sum-box h3.exp { color:#c2185b; }
  #printFrame .sum-box h3.rec { color:#1565c0; }
  #printFrame .sum-line   { display:flex; justify-content:space-between; padding:4px 0; font-size:12px; border-bottom:1px solid rgba(0,0,0,.06); }
  #printFrame .sum-line:last-child { border-bottom:none; }
  #printFrame .sum-line .k { color:#666; }
  #printFrame .sum-line .v { font-weight:700; }
  #printFrame .score-big  { font-size:19px; font-weight:800; }
  #printFrame .badge-ok   { display:inline-block; background:#e8f5e9 !important; color:#2e7d32; padding:2px 9px; border-radius:12px; font-size:11px; font-weight:700; }
  #printFrame .badge-warn { display:inline-block; background:#fff3e0 !important; color:#e65100; padding:2px 9px; border-radius:12px; font-size:11px; font-weight:700; }
  #printFrame .badge-bad  { display:inline-block; background:#ffebee !important; color:#b71c1c; padding:2px 9px; border-radius:12px; font-size:11px; font-weight:700; }
  #printFrame table       { width:100%; border-collapse:collapse; font-size:12px; margin-bottom:4px; }
  #printFrame th          { background:#f9f0f5 !important; color:#c2185b; font-weight:700; padding:7px 10px; border:1px solid #f0d0e0; font-size:11px; text-align:left; }
  #printFrame td          { padding:7px 10px; border:1px solid #eee; vertical-align:middle; }
  #printFrame tr:nth-child(even) td { background:#fafafa !important; }
  #printFrame .bar-track  { height:12px; background:#f0f0f0 !important; border-radius:6px; overflow:hidden; border:1px solid #e0e0e0; margin-top:6px; }
  #printFrame .bar-fill   { height:100%; border-radius:6px; display:flex; align-items:center; justify-content:flex-end; padding-right:6px; }
  #printFrame .bar-fill span { font-size:9px; color:#fff; font-weight:700; }
  #printFrame .guide      { background:#f0f9ff !important; border:1px solid #bae6fd; border-radius:8px; padding:10px 13px; margin-top:14px; font-size:11px; color:#0369a1; line-height:1.8; }
  #printFrame .footer     { margin-top:18px; padding-top:10px; border-top:1px solid #eee; font-size:10px; color:#999; text-align:center; }
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-inner">
      <div>
        <h1>📋 REVT 검사 시스템</h1>
        <p>수용·표현 어휘력 검사</p>
      </div>
      <div class="header-badge" id="headerAge">결과 자동 계산</div>
    </div>
  </div>

  <div class="step-wrap">
    <div class="step-bar">
      <div class="step-seg active" id="seg0"></div>
      <div class="step-seg" id="seg1"></div>
      <div class="step-seg" id="seg2"></div>
      <div class="step-seg" id="seg3"></div>
    </div>
    <div class="step-labels">
      <span id="sl0">기본정보</span>
      <span id="sl1">표현어휘</span>
      <span id="sl2">수용어휘</span>
      <span id="sl3">결과</span>
    </div>
  </div>

  <div class="content" id="main"></div>
</div>

function age(b,t){
  const bd=new Date(b),td=new Date(t);
  let y=td.getFullYear()-bd.getFullYear(), m=td.getMonth()-bd.getMonth();

  if(m<0){m+=12;y--;}
  return {y,m,tm:y*12+m};
}

function ceiling(items,start){

    }
  }
  // 100%ile 기준점과 같거나 초과
  if(score >= a[a.length-1]) return{label:'100%ile',val:100,barPct:100};
  return{label:'정보없음',val:0,barPct:0};
}
function getSD(score,g,type){
  const n=NORM[g]; if(!n) return{l:'정보없음',lv:0};
  const d=type==='rec'?n.rec:n.exp;
  const diff=score-d.mean;
  if(diff>=-d.sd)       return{l:'정상범주',lv:1};
  if(diff>=-2*d.sd)     return{l:'-1SD 이하',lv:-1};
  return{l:'-2SD 이하',lv:-2};
}
function moStr(v){
  if(typeof v==='string') return v;   // "30개월 미만" 등 문자열 그대로
  return `${v}개월`;                   // 숫자면 "130개월" 형태
}
function getEq(score,type){
  const c=Math.max(7,Math.min(155,score));
  return type==='rec'
    ?{mo:moStr(EQ_R_MO[c]),st:EQ_R_ST[c]||''}
    :{mo:moStr(EQ_E_MO[c]),st:EQ_E_ST[c]||''};
}
function sdCls(lv){ return lv===1?'good':lv===-1?'warn':'bad'; }
// pct는 이제 객체 {label, val, barPct} → val 기준으로 색상/클래스 결정
function pctCls(p){ return p>=25?'good':p>=10?'warn':'bad'; }
function pctColor(p){ return p>=25?'var(--green)':p>=10?'var(--amber)':'var(--red)'; }
function sdColor(lv){ return lv===1?'var(--green)':lv===-1?'var(--amber)':'var(--red)'; }

  if(b) b.addEventListener('change',e=>{S.birthDate=e.target.value; updAge();});
}
function updBtn0(){
  const btn=document.getElementById('btnNext0');
  if(btn) btn.disabled=!S.name||!S.testDate||!S.birthDate;
}
function updAge(){
  if(S.testDate&&S.birthDate){
    const a=age(S.birthDate,S.testDate);
    S.y=a.y; S.m=a.m; S.tm=a.tm;
    S.grp=grp(a.y,a.m);

    if(el) el.innerHTML=`<div class="age-badge">📅 만 ${a.y}세 ${a.m}개월 (${a.tm}개월) · ${S.grp}</div>`;

/* ── 네비 ── */
function go(n){ S.step=n; render(); window.scrollTo(0,0); }
function go1(){ S.eStart=eStart(S.y); S.step=1; render(); window.scrollTo(0,0); }
function go2(){ S.eScore=rawScore(S.eI,S.eBL,S.eCL); S.rStart=S.eBL||1; S.step=2; render(); window.scrollTo(0,0); }
function go3(){ S.rScore=rawScore(S.rI,S.rBL,S.rCL); S.step=3; render(); window.scrollTo(0,0); }

/* ── 문항 체크 ── */
function setPrac(k,v){ S.prac[k]=v; render(); }
function setE(id,val){
  S.eI[id]=val;
  S.eBL=baseline(S.eI,S.eStart);
  S.eCL=ceiling(S.eI,S.eStart);
  render();
  scrollToItem(`setE(${id},${val})`);
}
function setR(id,val){
  S.rI[id]=val;
  S.rBL=baseline(S.rI,S.rStart);
  S.rCL=ceiling(S.rI,S.rStart);
  render();
  scrollToItem(`setR(${id},${val})`);
}
function scrollToItem(attr){
  setTimeout(()=>{
    const el=document.querySelector(`[onclick="${attr}"]`);
    if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'});
  },50);
}

/* ── 탭 전환 ── */
function tab(t){
  ['e','r','b'].forEach(x=>{
    document.getElementById('t-'+x).className='tab'+(x===t?' active':'');
    document.getElementById('tc-'+x).className=(x===t?'':'hidden');
  });
}

function resetAll(){

}

    </div>
    <div class="info-row">
      <div class="info-box"><div class="lbl">아동 이름</div><div class="val">${S.name}</div></div>
      <div class="info-box"><div class="lbl">생년월일</div><div class="val">${S.birthDate}</div></div>
      <div class="info-box"><div class="lbl">생활연령</div><div class="val">만 ${S.y}세 ${S.m}개월</div><div class="sub">${g} · ${S.tm}개월</div></div>
    </div>
    <div class="sec">
      <div class="sec-title">종합 결과 요약</div>
      <div class="sum-row">
        <div class="sum-box exp">
          <h3 class="exp">📢 표현어휘력</h3>
          <div class="sum-line"><span class="k">원점수</span><span class="v score-big" style="color:#c2185b">${es}점</span></div>
          <div class="sum-line"><span class="k">등가월령</span><span class="v">${eEq.mo}</span></div>
          <div class="sum-line"><span class="k">등가연령</span><span class="v">${eEq.st}</span></div>
          <div class="sum-line"><span class="k">백분위</span><span class="v" style="color:${pC(eP.val)}">${eP.label}</span></div>
          <div class="sum-line"><span class="k">SD 판정</span><span class="${sBadge(eSD.lv)}">${eSD.l}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${eP.barPct}%;background:#c2185b"><span>${eP.label}</span></div></div>
        </div>
        <div class="sum-box rec">
          <h3 class="rec">👂 수용어휘력</h3>
          <div class="sum-line"><span class="k">원점수</span><span class="v score-big" style="color:#1565c0">${rs}점</span></div>
          <div class="sum-line"><span class="k">등가월령</span><span class="v">${rEq.mo}</span></div>
          <div class="sum-line"><span class="k">등가연령</span><span class="v">${rEq.st}</span></div>
          <div class="sum-line"><span class="k">백분위</span><span class="v" style="color:${pC(rP.val)}">${rP.label}</span></div>
          <div class="sum-line"><span class="k">SD 판정</span><span class="${sBadge(rSD.lv)}">${rSD.l}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${rP.barPct}%;background:#1565c0"><span>${rP.label}</span></div></div>
        </div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-title">규준 비교 — 표-27 연령별 평균 및 표준편차 (연령 집단: ${g})</div>
      ${nm ? `<table>
        <tr><th>구분</th><th>원점수</th><th>연령 평균</th><th>표준편차</th><th>-1SD 기준</th><th>-2SD 기준</th><th>판정</th></tr>
        <tr><td>표현어휘</td><td style="font-size:16px;font-weight:800;color:#c2185b">${es}</td><td>${nm.exp.mean}</td><td>${nm.exp.sd}</td>
            <td style="color:#e65100;font-weight:700">${(nm.exp.mean-nm.exp.sd).toFixed(2)}</td>
            <td style="color:#b71c1c;font-weight:700">${(nm.exp.mean-2*nm.exp.sd).toFixed(2)}</td>
            <td><span class="${sBadge(eSD.lv)}">${eSD.l}</span></td></tr>
        <tr><td>수용어휘</td><td style="font-size:16px;font-weight:800;color:#1565c0">${rs}</td><td>${nm.rec.mean}</td><td>${nm.rec.sd}</td>
            <td style="color:#e65100;font-weight:700">${(nm.rec.mean-nm.rec.sd).toFixed(2)}</td>
            <td style="color:#b71c1c;font-weight:700">${(nm.rec.mean-2*nm.rec.sd).toFixed(2)}</td>
            <td><span class="${sBadge(rSD.lv)}">${rSD.l}</span></td></tr>
      </table>` : '<p style="color:#999;font-size:12px">해당 연령 규준 없음</p>'}
    </div>
    <div class="sec">
      <div class="sec-title">등가연령 규준 — 표-28</div>
      <table>
        <tr><th>구분</th><th>원점수</th><th>등가월령</th><th>등가연령</th></tr>
        <tr><td>표현어휘</td><td>${es}점</td><td>${eEq.mo}</td><td>${eEq.st}</td></tr>
        <tr><td>수용어휘</td><td>${rs}점</td><td>${rEq.mo}</td><td>${rEq.st}</td></tr>
      </table>
    </div>
    <div class="sec">
      <div class="sec-title">백분위 규준 — 표-29 (연령 집단: ${g})</div>
      <table>
        <tr><th>구분</th><th>원점수</th><th>백분위</th><th>해석</th></tr>
        <tr><td>표현어휘</td><td>${es}점</td>
            <td style="color:${pC(eP.val)};font-weight:800">${eP.label}</td>
            <td>${eP.val>=50?'평균 이상':eP.val>=25?'평균 하':eP.val>=10?'약간 낮음':'매우 낮음'}</td></tr>
        <tr><td>수용어휘</td><td>${rs}점</td>
            <td style="color:${pC(rP.val)};font-weight:800">${rP.label}</td>
            <td>${rP.val>=50?'평균 이상':rP.val>=25?'평균 하':rP.val>=10?'약간 낮음':'매우 낮음'}</td></tr>
      </table>
    </div>
    <div class="sec">
      <div class="sec-title">검사 실시 정보</div>
      <table>
        <tr><th>구분</th><th>기초선</th><th>최고한계선</th><th>오답 수</th><th>원점수</th></tr>
        <tr><td>표현어휘</td><td>${S.eBL?S.eBL+'번':'미확립'}</td><td>${S.eCL?S.eCL+'번':'끝까지 실시'}</td><td>${eWrong}개</td><td>${es}점</td></tr>
        <tr><td>수용어휘</td><td>${S.rBL?S.rBL+'번':'미확립'}</td><td>${S.rCL?S.rCL+'번':'끝까지 실시'}</td><td>${rWrong}개</td><td>${rs}점</td></tr>
      </table>
    </div>
    <div class="guide">
      <b>📌 검사 해석 안내</b><br>
      • <b>정상범주</b>: 연령 평균 -1SD 이상 &nbsp;|&nbsp; <b>약간 낮음</b>: -1SD ~ -2SD &nbsp;|&nbsp; <b>언어발달지연</b>: -2SD 미만<br>
      • 백분위 <b>10%ile 미만</b>은 언어치료적 개입을 적극 고려하시기 바랍니다.<br>
      • 본 결과는 REVT(수용·표현 어휘력 검사, 김영태·홍경훈·김경희·장혜성·이주연, 서울장애인종합복지관, 2009) 규준에 따라 산출되었습니다.
    </div>
    <div class="footer">
      REVT 수용·표현 어휘력 검사 결과지 &nbsp;|&nbsp; ${S.name} &nbsp;|&nbsp; 평가일 ${S.testDate} &nbsp;|&nbsp; 출력일 ${new Date().toLocaleDateString('ko-KR')}
    </div>
  `;

  // 숨겨진 인쇄 프레임에 내용 삽입
  const frame = document.getElementById('printFrame');
  frame.innerHTML = printHTML;

  // 인쇄 실행
  window.print();

  // 인쇄 후 프레임 초기화 (약간 딜레이)
  setTimeout(() => { frame.innerHTML = ''; }, 1000);
}

/* ============================================================
   초기 실행
============================================================ */
render();
</script>
<div id="printFrame"></div>
</body>
</html>
